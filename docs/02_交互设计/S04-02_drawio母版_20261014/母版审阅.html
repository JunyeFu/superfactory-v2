</style><header><h1>超级工厂 · 工业工作台母版审阅</h1><p>draw.io r3 · 26个设计状态 · <a href="industrial-workbench-master.drawio">打开可编辑源</a> · <a href="README.md">画面说明</a> · 图稿审阅目录，实际业务交互另验。</p></header><main><nav aria-label="母版状态列表"></nav><section><div class="controls"><button id="previous">上一页</button><button id="next">下一页</button><span id="status" role="status" aria-live="polite"></span><button id="size" aria-pressed="false">原尺寸查看</button><a id="original" target="_blank" rel="noopener">打开原图</a></div><figure><img id="image" alt=""></figure><footer>顶部菜单、底部工具；时间轴与描述独立显隐。图中数量/时间为设计样例。场景插图不作为产品运行、3D模型或产能证明。</footer></section></main><script>
const pages=[{"id": "master-main", "title": "M01 · 工业工作台 / 紧凑主轴", "file": "母版_精细化预览.png"}, {"id": "master-left-collapsed", "title": "M02 · 左侧收起 / 中央扩展", "file": "左侧收起_预览.png"}, {"id": "master-right-collapsed", "title": "M03 · 右侧收起 / 中央扩展", "file": "右侧收起_预览.png"}, {"id": "master-both-collapsed", "title": "M04 · 两侧收起 / 大画布", "file": "两侧收起_预览.png"}, {"id": "master-wide-panels", "title": "M05 · 左右调宽 / 状态保留", "file": "面板调宽_预览.png"}, {"id": "master-device-detail", "title": "M06 · 设备详细字段 / 缺项定位", "file": "设备字段_精细化预览.png"}, {"id": "master-dirty-leave", "title": "M07 · 未应用更改 / 离开选择", "file": "未应用离开_预览.png"}, {"id": "master-timeline-hidden", "title": "M08 · 时间轴隐藏 / 保留描述", "file": "时间轴隐藏_预览.png"}, {"id": "master-description-hidden", "title": "M09 · 描述隐藏 / 时间轴铺满", "file": "描述隐藏_预览.png"}, {"id": "master-lower-hidden", "title": "M10 · 底部双面板隐藏 / 大画布", "file": "底部双面板隐藏_预览.png"}, {"id": "master-window-menu", "title": "M11 · 窗口菜单 / 面板显示关闭", "file": "窗口菜单_预览.png"}, {"id": "master-timeline-hidden-menu", "title": "M12 · 时间轴关闭后的窗口菜单", "file": "时间轴隐藏菜单_预览.png"}, {"id": "master-description-hidden-menu", "title": "M13 · 描述关闭后的窗口菜单", "file": "描述隐藏菜单_预览.png"}, {"id": "master-lower-hidden-menu", "title": "M14 · 双面板关闭后的窗口菜单", "file": "双面板隐藏菜单_预览.png"}, {"id": "master-axis-expanded", "title": "M15 · 主轴展开 / 设备与共享资源", "file": "主轴展开_预览.png"}, {"id": "master-line-axis", "title": "M16 · 流水线细化 / 裁窗保身份", "file": "流水线细化_预览.png"}, {"id": "master-device-axis", "title": "M17 · 设备运行明细 / 缺失历史", "file": "设备运行缺项_预览.png"}, {"id": "master-input-drag", "title": "M18 · 输入多选 / 吸附与联动预览", "file": "输入吸附联动_预览.png"}, {"id": "master-multi-hall", "title": "M19 · 多厂房画布 / 批次供货", "file": "多厂房供货_预览.png"}, {"id": "master-device-appearance", "title": "M20 · 设备表现创作 / 独立u轴", "file": "设备表现创作_预览.png"}, {"id": "master-simplified", "title": "M21 · 简化显示 / 身份与流向", "file": "简化档_预览.png"}, {"id": "master-region", "title": "M22 · 区域显示 / 成员入口", "file": "区域档_预览.png"}, {"id": "master-view-menu", "title": "M23 · 视图菜单 / 相机与显示", "file": "视图菜单_预览.png"}, {"id": "master-revision-conflict", "title": "M24 · 修订冲突 / 未应用字段保留", "file": "修订冲突_预览.png"}, {"id": "master-phase-appearance", "title": "M25 · 多阶段表现 / 有效进度绑定", "file": "多阶段表现_预览.png"}, {"id": "master-text-scale", "title": "M26 · 文字150% / 属性重排", "file": "文字放大_预览.png"}];let current=0;const nav=document.querySelector('nav'),figure=document.querySelector('figure'),image=document.querySelector('#image');
pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.title;b.dataset.page=i;b.onclick=()=>show(i);nav.append(b)});
function show(i){current=Math.max(0,Math.min(pages.length-1,i));const p=pages[current];image.src=p.file;image.alt=p.title+'，设计母版图稿';document.querySelector('#status').textContent=(current+1)+' / '+pages.length+' · '+p.title;document.querySelector('#original').href=p.file;document.querySelectorAll('nav button').forEach((b,n)=>b.setAttribute('aria-pressed',n===current));document.querySelector('#previous').disabled=current===0;document.querySelector('#next').disabled=current===pages.length-1;history.replaceState(null,'','#'+(current+1));}
document.querySelector('#previous').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#size').onclick=e=>{const full=figure.classList.toggle('original');e.currentTarget.setAttribute('aria-pressed',full);e.currentTarget.textContent=full?'适应窗口':'原尺寸查看'};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});show(Number(location.hash.slice(1)||1)-1);
</script></html>
