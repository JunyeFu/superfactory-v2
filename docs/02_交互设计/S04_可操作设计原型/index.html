<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>超级工厂 · S04可操作设计原型</title>
  <link rel="stylesheet" href="workbench.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
  <script src="prototype.data.js"></script>
</head>
<body>
  <header><strong>超级工厂 — <span id="project-title">控制盒厂房</span><span id="save-indicator"> · 未保存</span></strong><span>—　□　×</span></header>
  <nav id="menus" aria-label="工程菜单"></nav>
  <div class="context"><span id="context-label"></span><span>S04交互原型 · 预置设计样例 · 无产品Engine／Host／Agent</span></div>
  <main id="workbench">
    <aside id="library"></aside><div class="split" id="left-split" role="separator" aria-label="调整工程库宽度"></div>
    <section id="center">
      <div class="canvas-tabs"><button data-action="line-canvas">流水线画布</button><button data-action="multi-canvas">多厂房画布</button><span id="hall-label">厂房 A</span><div class="lod"><button data-action="lod-detailed">详细</button><button data-action="lod-simplified">简化</button><button data-action="lod-region">区域</button><label><input id="auto-lod" type="checkbox">自动</label></div></div>
      <div id="workspace"><div id="scene"><div id="scene-labels"></div><div class="viewport-badge">实际3D资产预览 · 业务结果为手工预期</div></div><div id="task-workspace"></div></div>
      <div id="dock-grip" role="separator" aria-label="调整时间轴高度"></div>
      <section id="dock"><div id="description"></div><div class="split" id="description-split" role="separator" aria-label="调整描述宽度"></div><div id="timeline"></div></section>
    </section>
    <div class="split" id="right-split" role="separator" aria-label="调整属性宽度"></div><aside id="properties"></aside>
  </main>
  <div class="bottom-tools" id="tools"></div><footer><span id="status"></span><span id="source-label"></span></footer>
  <dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="project-file" accept="application/json,.json" hidden><input type="file" id="media-file" accept="image/png,image/jpeg,image/gif" hidden>
  <script type="module" src="workbench.js"></script>
</body></html>
