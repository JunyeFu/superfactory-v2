[package]
name = "drf04-s05-desktop-proof"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["wry", "custom-protocol"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = { version = "=1.2.3", features = ["derive"] }
base64 = "=0.22.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "process", "time"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO"] }
