import * as T from '/node_modules/three/build/three.module.js';import{RoomEnvironment}from '/node_modules/three/examples/jsm/environments/RoomEnvironment.js';import{OrbitControls}from '/node_modules/three/examples/jsm/controls/OrbitControls.js';import{decodeGlb}from '../../../../packages/presentation/src/glb.ts';import{bindScene}from '../../../../packages/presentation/src/scene.ts';import{assetKey}from '../../../../packages/presentation/src/types.ts';import{specs,auxSeat,outputPort,stagingX,workY,wasteSeat,wastePort,componentSeat,wasteState,componentState}from '../../../../modules/media/native-equipment-500/reviews/B02-Q11/source/batch-spec.mjs';
const home='/modules/media/native-equipment-500/reviews/B02-Q11/',renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1400,900);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.getElementById('view').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e2e9ed');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8495a0,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(25,25),new T.MeshStandardMaterial({color:'#d0dce3',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;scene.add(floor);const camera=new T.PerspectiveCamera(36,1400/900,.01,50),orbit=new OrbitControls(camera,renderer.domElement);camera.position.set(2.7,2.4,3.2);orbit.target.set(0,1,0);orbit.update();
const instances=[],load=async base=>{const p=(await fetch(base+'module.json').then(r=>r.json())).data.definition.payload.data,bytes=await fetch(base+(p.source.data.path)).then(r=>r.arrayBuffer()),decoded=await decodeGlb(bytes),rig=await bindScene(p,async()=>bytes,{assetKey:assetKey(p.source.data),decoded});scene.add(rig.root);const ids=new Map(p.nodes.map(n=>[n.name,n.id]));return{p,rig,decoded,object:name=>rig.nodes.get(ids.get(name))};};
function apply(o,phase,u,state=null){const key=state?state+':'+phase:phase,clip=o.p.timeline.find(t=>t.phase_ref===key);if(!clip)throw Error('No clip '+key);o.rig.apply({known:true,display_phase_id:key,effective_ms:u*1000,duration_ms:1000,progress:u,terminal_pose:false},{clip,progress:u});}
async function dispose(){for(const o of instances){scene.remove(o.rig.root);o.rig.dispose();o.decoded.dispose();}instances.length=0;}
const item=async(id,role)=>{const o=await load(home+'items/'+id+'-'+role+'/');instances.push(o);return o;};
const world=(o,p=[0,0,0])=>o.localToWorld(new T.Vector3(...p)),point=o=>o.getWorldPosition(new T.Vector3()),write=async(name,data)=>{const r=await fetch('/native500-save/b02-q11-'+name,{method:'POST',body:data});if(!r.ok)throw Error('save '+name);};
async function picture(name){renderer.render(scene,camera);await write(name,await new Promise(r=>renderer.domElement.toBlob(r,'image/png')));}
window.checkBatch=async()=>{const checks=[];
for(const[id,s]of Object.entries(specs)){
 await dispose();const machine=await load(home+'installable/'+id+'/');instances.push(machine);const raw=await item(id,'input'),aux=s.auxiliary?await item(id,'auxiliary'):null,component=s.rule==='assemble'?await item(id,'component'):null,out=await item(id,'output'),waste=s.extra_outputs.length?await item(id,'waste'):null,block=await load(home+'items/blocker/');instances.push(block);const row={id,stages:[],passed:true};
 for(const[stage,phase,u]of[['input','load',0],['loading','load',.75],['processing','auto',.50],['late-processing','auto',.75],['output_wait','unload',1],...(waste?[['waste_wait','unload',1]]:[]),['delivered','unload',1]]){
  apply(machine,phase,u);const done=['output_wait','waste_wait','delivered'].includes(stage);apply(raw,phase,u,s.initial);raw.rig.root.position.copy(point(machine.object('PaperSeat')));raw.rig.root.visible=!done;raw.rig.root.updateMatrixWorld(true);
  if(aux){apply(aux,phase,u,s.auxiliary);aux.rig.root.position.fromArray(auxSeat());aux.rig.root.visible=!done;aux.rig.root.updateMatrixWorld(true);}
  if(component){apply(component,phase,u,componentState(id));component.rig.root.position.fromArray(componentSeat());component.rig.root.visible=!done;component.rig.root.updateMatrixWorld(true);}
  apply(out,'load',0,s.final);out.rig.root.visible=done;out.rig.root.position.fromArray(stage==='delivered'||stage==='waste_wait'?outputPort():[stagingX,workY,0]);out.rig.root.updateMatrixWorld(true);
  if(waste){apply(waste,'load',0,wasteState(id));waste.rig.root.visible=done;waste.rig.root.position.fromArray(stage==='waste_wait'?wasteSeat():wastePort());waste.rig.root.updateMatrixWorld(true);}
  block.rig.root.visible=stage==='output_wait'||stage==='waste_wait';block.rig.root.position.fromArray(stage==='waste_wait'?wastePort():outputPort());block.rig.root.updateMatrixWorld(true);
  if(stage==='output_wait'){row.output_gap_m=new T.Box3().setFromObject(block.rig.root).min.x-new T.Box3().setFromObject(out.rig.root).max.x;if(row.output_gap_m<.01)throw Error(id+' private output overlaps public blocker');}
  if(stage==='waste_wait'&&new T.Box3().setFromObject(waste.rig.root).intersectsBox(new T.Box3().setFromObject(block.rig.root)))throw Error(id+' private/public waste overlap');
  if(stage==='delivered'){camera.position.set(1.52,s.kind==='plate'?1.03:1.42,s.kind==='plate'?.32:.18);orbit.target.set(1.32,workY+.02,0);}else if(stage.includes('processing')){camera.position.set(['rope','slot'].includes(s.kind)?.28:.10,['rope','slot'].includes(s.kind)?1.12:1.35,['rope','slot'].includes(s.kind)?.28:.30);orbit.target.set(0,workY+(['rope','slot'].includes(s.kind)?.02:.12),0);}else{camera.position.set(2.7,2.4,3.2);orbit.target.set(0,1,0);}
  orbit.update();await picture(id+'-'+stage.replaceAll('_','-')+'.png');row.stages.push(stage);if(stage==='processing')await picture(id+'/action-50.png');
 }
 checks.push(row);
}
const result={passed:true,evidence_origin:'component_actual_GLB',not_Native_acceptance:true,checks};await write('coarse-layout-checks.json',JSON.stringify(result,null,2));return result;};
window.checkFeet=async()=>{const checks=[];for(const id of Object.keys(specs))for(const lod of['simple','detailed']){
 await dispose();const o=await load(home+'installable/'+id+(lod==='simple'?'-simple':'')+'/');instances.push(o);apply(o,'auto',.5);o.rig.root.updateMatrixWorld(true);const contacts=[];
 for(const x of[-1.52,1.52])for(const z of[-.78,.78]){const foot=new T.Box3().setFromObject(o.object('Foot_'+x+'_'+z)),stud=new T.Box3().setFromObject(o.object('Stud_'+x+'_'+z));contacts.push({bottom_gap_m:foot.min.y,top_gap_m:stud.min.y-foot.max.y});}
 if(contacts.some(c=>Math.abs(c.bottom_gap_m)>.001||Math.abs(c.top_gap_m)>.001))throw Error(id+' unsupported feet');camera.position.set(2.0,.25,1.2);orbit.target.set(1.52,.06,.78);orbit.update();await picture(id+'/'+lod+'-foot-contact.png');checks.push({id,lod,module_ref:{id:o.p.source.data.id.slice(0,-4),version:'1.1.0'},contacts});
}const result={passed:true,actual_product_decoder:true,models:checks.length,checks};await write('foot-contact-checks.json',JSON.stringify(result,null,2));return result;};
