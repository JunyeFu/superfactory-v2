<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Q22同一箱件输送组件检查</title><style>body{margin:0;background:#e2e9ed}canvas{display:block}</style><div id="view"></div><script type="module">
import * as T from '/node_modules/three/build/three.module.js';import{RoomEnvironment}from '/node_modules/three/examples/jsm/environments/RoomEnvironment.js';import{OrbitControls}from '/node_modules/three/examples/jsm/controls/OrbitControls.js';import{decodeGlb}from '../../../../packages/presentation/src/glb.ts';import{bindScene}from '../../../../packages/presentation/src/scene.ts';import{assetKey}from '../../../../packages/presentation/src/types.ts';import{specs,feet,heading,outputPort}from '../../../../modules/media/native-equipment-500/reviews/B01-Q22/source/batch-spec.mjs';
const home='/modules/media/native-equipment-500/reviews/B01-Q22/',renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1400,900);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.getElementById('view').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e2e9ed');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8495a0,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(25,25),new T.MeshStandardMaterial({color:'#d0dce3',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;scene.add(floor);const camera=new T.PerspectiveCamera(36,1400/900,.01,50),orbit=new OrbitControls(camera,renderer.domElement);camera.position.set(3.5,3.0,4.0);orbit.target.set(.10,1.0,0);orbit.update();
const instances=[],load=async base=>{const p=(await fetch(base+'module.json').then(r=>r.json())).data.definition.payload.data,bytes=await fetch(base+p.source.data.path).then(r=>r.arrayBuffer()),decoded=await decodeGlb(bytes),rig=await bindScene(p,async()=>bytes,{assetKey:assetKey(p.source.data),decoded});scene.add(rig.root);const ids=new Map(p.nodes.map(n=>[n.name,n.id]));return{p,rig,decoded,object:name=>rig.nodes.get(ids.get(name))};};
function apply(o,ph,u,state=null){const key=state?state+':'+ph:ph,clip=o.p.timeline.find(t=>t.phase_ref===key);if(!clip)throw Error(key);o.rig.apply({known:true,display_phase_id:key,effective_ms:u*1000,duration_ms:1000,progress:u,terminal_pose:false},{clip,progress:u});}
async function dispose(){for(const o of instances){scene.remove(o.rig.root);o.rig.dispose();o.decoded.dispose();}instances.length=0;}
const write=async(name,data)=>{const r=await fetch('/native500-save/b01-q22-'+name,{method:'POST',body:data});if(!r.ok)throw Error(name);};async function picture(name){renderer.render(scene,camera);await write(name,await new Promise(r=>renderer.domElement.toBlob(r,'image/png')));}
window.checkBatch=async()=>{const checks=[];for(const[id,s]of Object.entries(specs)){
 await dispose();const machine=await load(home+'installable/'+id+'/'),raw=await load(home+'items/'+id+'-input/'),block=await load(home+'items/blocker/');instances.push(machine,raw,block);const row={id,stages:[],passed:true};
 for(const[stage,ph,u]of[['input','load',0],['loading','load',.75],['processing','auto',.50],['late-processing','auto',.75],['output_wait','auto',0],['delivered','unload',1]]){
  apply(machine,ph,u);apply(raw,ph,u,s.initial);machine.rig.root.updateMatrixWorld(true);const anchor=machine.object('PaperSeat');raw.rig.root.position.copy(anchor.getWorldPosition(new T.Vector3()));raw.rig.root.quaternion.copy(anchor.getWorldQuaternion(new T.Quaternion()));
  if(stage==='delivered'){raw.rig.root.position.fromArray(outputPort(id));raw.rig.root.quaternion.setFromAxisAngle(new T.Vector3(0,1,0),heading(id,'unload',1));}
  raw.rig.root.updateMatrixWorld(true);block.rig.root.visible=stage==='output_wait';block.rig.root.position.fromArray(outputPort(id));block.rig.root.updateMatrixWorld(true);
  if(stage==='output_wait'){const a=new T.Box3().setFromObject(raw.rig.root),b=new T.Box3().setFromObject(block.rig.root);row.output_gap_m=Math.max(b.min.x-a.max.x,b.min.z-a.max.z);if(row.output_gap_m<.01)throw Error(id+' held item overlaps public blocker');}
  if(stage==='delivered'){const p=outputPort(id);camera.position.set(p[0]+.25,p[1]+.40,p[2]+.28);orbit.target.set(p[0],p[1]+.06,p[2]);}else{camera.position.set(3.5,3.0,4.0);orbit.target.set(.10,1.0,0);}orbit.update();await picture(id+'-'+stage.replaceAll('_','-')+'.png');if(stage==='processing')await picture(id+'/action-50.png');row.stages.push(stage);
 }
 checks.push(row);
}const result={passed:true,evidence_origin:'component_actual_GLB',not_Native_acceptance:true,checks};await write('coarse-layout-checks.json',JSON.stringify(result,null,2));return result;};
window.checkFeet=async()=>{const checks=[];for(const id of Object.keys(specs))for(const lod of['simple','detailed']){
 await dispose();const o=await load(home+'installable/'+id+(lod==='simple'?'-simple':'')+'/');instances.push(o);apply(o,'auto',.5);o.rig.root.updateMatrixWorld(true);const contacts=[];
 for(const[x,z]of feet(id)){const f=new T.Box3().setFromObject(o.object('Foot_'+x+'_'+z)),s=new T.Box3().setFromObject(o.object('Stud_'+x+'_'+z));contacts.push({bottom_gap_m:f.min.y,top_gap_m:s.min.y-f.max.y});}
 // Gap values diagnose a visible support defect; efficient review has no micrometer gate.
 const[x,z]=feet(id)[0];camera.position.set(x+.45,.23,z+.45);orbit.target.set(x,.06,z);orbit.update();await picture(id+'/'+lod+'-foot-contact.png');checks.push({id,lod,module_ref:{id:o.p.source.data.id.slice(0,-4),version:'1.1.0'},contacts});
}const result={passed:true,actual_product_decoder:true,models:checks.length,checks};await write('foot-contact-checks.json',JSON.stringify(result,null,2));return result;};
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera);}animate();
</script>
