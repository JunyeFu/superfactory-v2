<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Q18布局与物料组件复核 · 未准入</title><style>body{margin:0;font:16px Microsoft YaHei;background:#e2e9ed;color:#183b4d}header{padding:12px}canvas{display:block}button{font:inherit}</style><header>Q18 三设备 · 实际GLB与产品解码/绑定 · 组件检查，非Native验收 <button id="run">检查阶段布局</button><span id="status"></span></header><div id="view"></div><script type="module">
import * as T from 'three';import{RoomEnvironment}from 'three/addons/environments/RoomEnvironment.js';import{OrbitControls}from 'three/addons/controls/OrbitControls.js';import{decodeGlb}from '../../../../packages/presentation/src/glb.ts';import{bindScene}from '../../../../packages/presentation/src/scene.ts';import{assetKey}from '../../../../packages/presentation/src/types.ts';import{specs,seat,auxSeat,outputPort,outputY,stagingX,workY,box as c,contentSeats}from '../../../../modules/media/native-equipment-500/reviews/B01-Q18/source/batch-spec.mjs';
const home='/modules/media/native-equipment-500/reviews/B01-Q18/',renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1400,900);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.getElementById('view').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e2e9ed');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8495a0,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(4,8,5);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(25,25),new T.MeshStandardMaterial({color:'#d0dce3',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;scene.add(floor);const camera=new T.PerspectiveCamera(36,1400/900,.01,50),orbit=new OrbitControls(camera,renderer.domElement);camera.position.set(2.7,2.4,3.2);orbit.target.set(0,1,0);orbit.update();
const instances=[],load=async base=>{const p=(await fetch(base+'module.json').then(r=>r.json())).data.definition.payload.data,bytes=await fetch(base+(p.source.data.path)).then(r=>r.arrayBuffer()),decoded=await decodeGlb(bytes),rig=await bindScene(p,async()=>bytes,{assetKey:assetKey(p.source.data),decoded});scene.add(rig.root);const ids=new Map(p.nodes.map(n=>[n.name,n.id]));return{p,rig,decoded,object:name=>rig.nodes.get(ids.get(name))};};
function apply(o,phase,u,state=null){const key=state?state+':'+phase:phase,clip=o.p.timeline.find(t=>t.phase_ref===key);if(!clip)throw Error('No clip '+key);o.rig.apply({known:true,display_phase_id:key,effective_ms:u*1000,duration_ms:1000,progress:u,terminal_pose:false},{clip,progress:u});}
async function dispose(){for(const o of instances){scene.remove(o.rig.root);o.rig.dispose();o.decoded.dispose();}instances.length=0;}
const item=async(id,role)=>{const o=await load(home+'items/'+id+'-'+role+'/');instances.push(o);return o;};
const world=(o,p=[0,0,0])=>o.localToWorld(new T.Vector3(...p)),point=o=>o.getWorldPosition(new T.Vector3()),write=async(name,data)=>{const r=await fetch('/native500-save/b01-q18-'+name,{method:'POST',body:data});if(!r.ok)throw Error('save '+name);};
async function picture(name){renderer.render(scene,camera);await write(name,await new Promise(r=>renderer.domElement.toBlob(r,'image/png')));}
window.checkBatch=async()=>{const checks=[];
 for(const[id,s]of Object.entries(specs)){
  await dispose();const machine=await load(home+'installable/'+id+'/');instances.push(machine);const raw=await item(id,'input'),aux=s.auxiliary?await item(id,'auxiliary'):null,block=await load(home+'items/blocker/');instances.push(block);const units=[];for(let i=0;i<6;i++){const o=await load(home+'items/content-unit/');instances.push(o);units.push(o);}
  const row={id,passed:true,samples:[],critical_layout_checks:{}};
  for(const[phase,u,label]of[['load',0,'input'],['load',.5,'loading'],['auto',.50,'processing'],['auto',.86,'late-processing'],['load',1,'output_wait'],['unload',1,'delivered']]){
   const state=label==='delivered'?s.final:s.initial;apply(machine,phase,u);apply(raw,phase,u,state);raw.rig.root.position.copy(point(machine.object('PaperSeat')));if(label==='delivered')raw.rig.root.position.fromArray(outputPort(id));raw.rig.root.updateMatrixWorld(true);
   if(aux){apply(aux,phase,u,s.auxiliary);aux.rig.root.position.fromArray(auxSeat());aux.rig.root.updateMatrixWorld(true);aux.rig.root.visible=label!=='delivered';}
   for(let i=0;i<6;i++){const o=units[i];o.rig.root.position.copy(point(raw.object('ContentSeat_'+i)));o.rig.root.updateMatrixWorld(true);}
   block.rig.root.position.fromArray(outputPort(id));block.rig.root.visible=label==='output_wait';block.rig.root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(raw.rig.root);
   if(label==='output_wait'){const bb=new T.Box3().setFromObject(block.rig.root),gap=bb.min.x-bounds.max.x;row.output_buffer_gap_m=gap;if(!(gap>.01))throw Error(id+' overlaps output occupant');}
   row.samples.push({phase,u,label,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}});if(['input','processing','output_wait','delivered'].includes(label))row.critical_layout_checks[label]='pass';
   if(label==='delivered'){camera.position.set(1.92,1.70,.58);orbit.target.set(1.32,1.06,0);}else if(label==='processing'||label==='late-processing'){camera.position.set(.75,1.85,1.20);orbit.target.set(0,1.10,0);}else{camera.position.set(2.7,2.4,3.2);orbit.target.set(0,1,0);}orbit.update();await picture(id+'-'+label.replaceAll('_','-')+'.png');
  }checks.push(row);
 }
 const result={passed:true,evidence_origin:'component_actual_GLB',scope:'actual GLB mechanism, finished package, six separate child previews and separated occupied output; not Native',checks};await write('coarse-layout-checks.json',JSON.stringify(result,null,2));document.getElementById('status').textContent='三台组件图已生成；尚需逐图复审与Native';return result;
};
window.checkFeet=async()=>{const checks=[];for(const id of Object.keys(specs))for(const lod of['simple','detailed']){await dispose();const o=await load(home+'installable/'+id+(lod==='simple'?'-simple':'')+'/');instances.push(o);apply(o,'auto',.5);o.rig.root.updateMatrixWorld(true);const contacts=[];for(const x of[-1.52,1.52])for(const z of[-.78,.78]){const foot=new T.Box3().setFromObject(o.object('Foot_'+x+'_'+z)),stud=new T.Box3().setFromObject(o.object('Stud_'+x+'_'+z));contacts.push({bottom_gap_m:foot.min.y,top_gap_m:stud.min.y-foot.max.y});}if(contacts.some(c=>Math.abs(c.bottom_gap_m)>.001||Math.abs(c.top_gap_m)>.001))throw Error(id+' unsupported feet');camera.position.set(2.0,.25,1.2);orbit.target.set(1.52,.06,.78);orbit.update();renderer.render(scene,camera);const name=id+'/'+lod+'-foot-contact.png';await picture(name);checks.push({id,lod,module_ref:{id:'sf.native50.media.'+id+(lod==='simple'?'.simple':''),version:'1.1.0'},contacts});}const r={passed:true,actual_product_decoder:true,models:checks.length,checks};await write('foot-contact-checks.json',JSON.stringify(r,null,2));return r;};
document.getElementById('run').onclick=()=>window.checkBatch();function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera);}animate();document.getElementById('status').textContent='就绪';</script>
