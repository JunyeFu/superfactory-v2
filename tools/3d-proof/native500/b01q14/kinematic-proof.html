<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>B01-Q14 锁底联动诊断 · 未准入</title><style>body{margin:0;background:#dce5eb;font:16px Microsoft YaHei,sans-serif;color:#183543}header{padding:12px 18px;background:#213d4f;color:white}#status{color:#ffd48b}canvas{display:block;width:1500px;height:920px}</style><header>锁底几何诊断：实际 GLB / 产品解码与绑定；厚度及胶层补偿未通过，不计正式支持。 <span id="status">读取中</span></header><canvas id="c"></canvas>
<script type="module">
import * as T from 'three';import {decodeGlb}from '../../../../packages/presentation/src/glb.ts';import{bindScene}from '../../../../packages/presentation/src/scene.ts';import{assetKey}from '../../../../packages/presentation/src/types.ts';import{carton,gluePolygon,targetGluePoint,allParts,stockArea}from '../../../../modules/media/native-equipment-500/reviews/B01-Q14/source/lock-bottom-kinematics.mjs';
const base='/.work/native500-quality-20261025/b01q14/prototype/',p=await fetch(base+'presentation.json').then(r=>r.json()),bytes=await fetch(base+'neutral-lock-stock.glb').then(r=>r.arrayBuffer()),decoded=await decodeGlb(bytes),rig=await bindScene(p,async()=>bytes,{assetKey:assetKey(p.source.data),decoded});
const object=n=>rig.nodes.get(p.nodes.find(o=>o.name===n).id),apply=(phase,u)=>{const clip=p.timeline.find(c=>c.phase_ref===phase);rig.apply({known:true,display_phase_id:phase,effective_ms:u*1000,duration_ms:1000,progress:u,terminal_pose:false},{clip,progress:u});rig.root.updateMatrixWorld(true);};
let maxGap=0,totalVolume=0;const seen=new Set();rig.root.traverse(o=>{if(!o.isMesh||seen.has(o))return;seen.add(o);const v=o.geometry.attributes.position,idx=o.geometry.index;let sum=0;for(let i=0;i<(idx?.count??v.count);i+=3){const a=[0,1,2].map(j=>new T.Vector3().fromBufferAttribute(v,idx?idx.getX(i+j):i+j));sum+=a[0].dot(a[1].clone().cross(a[2]))/6;}totalVolume+=Math.abs(sum);});if(Math.abs(totalVolume-stockArea()*carton.paperThickness)>1e-10)throw Error('actual mesh paper volume differs');
const samples=[];for(const u of[0,.03125,.1,.2,.3,.4,.5,.6,.7,.8,.9,.95,.98,.99,.999,1]){apply('erection',u);let defect=0;for(const index of[0,2]){const n=object('Bottom'+index+'_ear'),w=object('Bottom'+(index+1)+'_main'),normal=new T.Vector3(0,1,0).transformDirection(n.matrixWorld);for(const q of gluePolygon(index)){const a=n.localToWorld(q.clone()),b=w.localToWorld(targetGluePoint(index,q));maxGap=Math.max(maxGap,a.distanceTo(b));const faceGap=b.clone().sub(a).dot(normal)-carton.paperThickness;defect=Math.max(defect,carton.glueThickness-faceGap);}}samples.push({u,missing_face_allowance_m:defect});}if(maxGap>1e-5)throw Error('actual GLB neutral link opens '+maxGap);if(!samples.every(s=>s.missing_face_allowance_m>.00059))throw Error('uncompensated thickness diagnostic changed; inspect actual faces');
const proof={overall_device_acceptance:false,actual_product_decoder:true,actual_GLB_neutral_linkage_passed:true,max_neutral_gap_m:maxGap,actual_mesh_paper_volume_m3:totalVolume,finite_layers_passed:false,samples,Native:false};const response=await fetch('/native500-save/b01-q14-neutral-diagnostic-checks.json',{method:'POST',body:JSON.stringify(proof,null,2)});if(!response.ok)throw Error('proof write failed');
for(const part of allParts()){const node=object(part.name);node.traverse(o=>{if(!o.isMesh)return;o.material=o.material.clone();o.material.color.set(part.piece==='ear'?'#83b29f':part.kind==='bottom'?(part.index===1?'#ab8e5c':'#dbc493'):'#cbb17d');const edges=new T.LineSegments(new T.EdgesGeometry(o.geometry,5),new T.LineBasicMaterial({color:'#375365'}));o.add(edges);});}
const canvas=document.getElementById('c'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1500,920,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.setScissorTest(true);
const scene=new T.Scene();scene.background=new T.Color('#e4eaee');scene.add(new T.HemisphereLight(0xffffff,0x5d7381,2.3));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(3,5,4);scene.add(light);scene.add(rig.root);const plane=new T.Mesh(new T.PlaneGeometry(4,4),new T.MeshStandardMaterial({color:'#c9d4dc',roughness:.9}));plane.rotation.x=-Math.PI/2;plane.position.y=-.002;scene.add(plane);const grid=new T.GridHelper(2,40,0xa3b2bf,0xbdcbd5);grid.position.y=-.001;scene.add(grid);
const camera=new T.PerspectiveCamera(36,750/460,.001,30),views=[['manufacture',0],['manufacture',1],['erection',.5],['erection',1]];
for(let i=0;i<views.length;i++){const [ph,u]=views[i];apply(ph,u);const box=new T.Box3().setFromObject(rig.root),target=box.getCenter(new T.Vector3()),extent=Math.max(...box.getSize(new T.Vector3()).toArray());camera.position.copy(target).addScaledVector(new T.Vector3(i>=2?-.7:.7,.65,1).normalize(),extent/Math.sin(Math.PI/10)*.9);camera.lookAt(target);const x=i%2*750,y=(1-Math.floor(i/2))*460;renderer.setViewport(x,y,750,460);renderer.setScissor(x,y,750,460);renderer.render(scene,camera);}
const composite=document.createElement('canvas');composite.width=1500;composite.height=920;const ctx=composite.getContext('2d');ctx.drawImage(canvas,0,0);for(let i=0;i<views.length;i++){const x=i%2*750,y=Math.floor(i/2)*460;ctx.fillStyle='#203c4f';ctx.fillRect(x+12,y+12,726,42);ctx.fillStyle='white';ctx.font='20px Microsoft YaHei';ctx.fillText(['原始锁底坯：四底片、两个45°胶耳','折平：胶耳与相邻大底片建立连接','开筒50%：底片联动展开','开筒100%：互补台阶底片覆盖底面'][i],x+24,y+40);}ctx.fillStyle='#804426';ctx.fillRect(12,878,1476,30);ctx.fillStyle='white';ctx.font='17px Microsoft YaHei';ctx.fillText('中性面/轮廓诊断；有限纸厚与胶层补偿未通过。不是设备准入或 Native 业务验收。',24,900);await fetch('/native500-save/b01-q14-neutral-diagnostic-views.png',{method:'POST',body:await new Promise(r=>composite.toBlob(r,'image/png'))});
document.getElementById('status').textContent='中性面联动通过；有限厚度每处缺0.6mm补偿，仍待修正';window.diagnosticProof=proof;
</script>
