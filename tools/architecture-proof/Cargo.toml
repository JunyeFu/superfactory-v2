[package]
name = "superfactory-architecture-proof"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "sync", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = { version = "=1.2.3", features = ["derive"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
parry3d-f64 = { version = "=0.31.1", features = ["enhanced-determinism"] }
printpdf = { version = "=0.12.8", default-features = false, features = ["png", "jpeg"] }
csv = "=1.4.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_IO"] }
