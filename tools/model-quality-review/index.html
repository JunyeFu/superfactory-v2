<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>超级工厂 · 实际GLB逐模型审阅</title>
<style>html,body{height:100%}body{margin:0;display:flex;flex-direction:column;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;background:#e4e9ee;color:#20364a}header{padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f7f9fb;border-bottom:1px solid #bcc9d3}button,select{padding:7px;border:1px solid #9aafbd;border-radius:4px;background:white;color:#20364a}#viewport{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}canvas{max-width:100%;max-height:100%;object-fit:contain}footer{padding:8px 18px;background:white;flex:none}#status{font-weight:600;overflow-wrap:anywhere}#note{margin-top:5px;color:#526579}#asset-source{font:12px Consolas,monospace;overflow-wrap:anywhere;color:#526579}#phase-progress{width:115px}</style>
<style>html,body{width:100%;min-width:0;overflow-x:hidden}header,footer,#viewport{width:100%;min-width:0;box-sizing:border-box}#viewport canvas{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;display:block}header select{max-width:145px}header button{font-size:12px}header b{font-size:13px}</style>
<header><b>超级工厂 · GLB质量审阅 0.4</b><select id="model" aria-label="模型类别"></select><select id="variant" aria-label="模型精细度"><option value="detailed">详细档</option><option value="simple">简化档</option></select><select id="view" aria-label="观察方向"><option>isometric</option><option>front</option><option>back</option><option>left</option><option>right</option><option>top</option><option>bottom</option><option>closeup</option></select><button id="capture">导出当前档多视角与动作</button><button id="all">逐个导出14类详细档</button><button id="simple-all">补齐14类简化档</button><button id="play">播放声明动作</button></header>
<div id="viewport"></div><footer><div id="status">正在读取真实GLB…</div><div id="asset-source"></div><div id="note">画面读取导出的GLB，不使用AI预览图。动作是声明阶段预览；静态物品仅作观察转台，不代表生产结果。</div></footer>
