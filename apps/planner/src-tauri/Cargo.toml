[package]
name = "sf-desktop-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "superfactory"

[lib]
name = "sf_desktop_host"

[[bin]]
name = "superfactory"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
nfr-devtools = ["tauri/devtools"]
nfr-path-fixture = []
nfr06-save-faults = ["sf-commands/nfr06-save-faults"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
sf-domain.workspace = true
sf-commands.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
windows-sys.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
