[package]
name = "sf-cloud-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Temporary independent build boundary until the complete producer is received.
[workspace]

[dependencies]
sf-domain = { path = "../../packages/domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "=0.8.9"
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "=0.14.2"
native-tls = "=0.2.18"
postgres-native-tls = "=0.5.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
base64 = "=0.22.1"
