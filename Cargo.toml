[workspace]
resolver = "3"
members = ["packages/domain", "packages/simulation", "packages/module-kit", "packages/packaging", "packages/reporting", "packages/commands", "apps/planner/src-tauri", "apps/mcp-bridge"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
sf-domain = { path = "packages/domain" }
sf-simulation = { path = "packages/simulation" }
sf-module-kit = { path = "packages/module-kit" }
sf-packaging = { path = "packages/packaging" }
sf-reporting = { path = "packages/reporting" }
sf-commands = { path = "packages/commands" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
schemars = { version = "=1.2.3" }
ts-rs = { version = "=12.0.1" }
tauri = { version = "=2.12.3", default-features = false, features = ["wry"] }
tauri-build = { version = "=2.7.2" }
tauri-plugin-dialog = { version = "=2.8.2" }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
parry3d-f64 = { version = "=0.31.1" }
printpdf = { version = "=0.12.8", features = ["png"] }
csv = { version = "=1.4.0" }
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = { version = "=0.21.1" }
num-bigint = { version = "=0.4.6" }
num-rational = { version = "=0.4.2" }
num-traits = { version = "=0.2.19" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }
